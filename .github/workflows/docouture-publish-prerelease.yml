name: docouture-publish-prerelease

# Rebuilds and republishes the prerelease (prerelease-branch) docs
# automatically on every ordinary push to the prerelease branch that
# actually touches content — no docs/release label needed, unlike
# docouture-release.yml. This exists specifically so ordinary content merges
# show up without anyone having to fall back to docouture-publish.yml's own
# workflow_dispatch every time.
#
# A plain `on: push: branches: [<prerelease branch>*]` used to live directly
# on docouture-publish.yml and was removed for two reasons — see that
# file's own header comment. Both are avoided here by construction rather
# than by reintroducing the same trigger in the same place:
#
#   1. An unrelated commit shouldn't kick off a rebuild with nothing new to
#      publish. `check-changes-in-paths` (below) gates on real content paths
#      only. In particular this deliberately excludes docs/.release-version:
#      that file is the ONLY thing docouture-release.yml's own "Bump release
#      descriptor" step pushes straight to the release branch directly (see
#      that workflow's own comment on that step; under git-flow it reaches
#      this branch later, through the sync pull request that workflow's
#      `sync-prerelease` job opens, which is an ordinary merge) — a bot
#      commit that is not
#      new docs content, and (trunk-based only, where prerelease and release
#      are the same branch) would otherwise fire this workflow for nothing.
#
#   2. Firing twice for one release — once from a docs/release-labeled
#      merge's own content, and again from docouture-release.yml's chained
#      docouture-publish.yml call once the tag is actually cut — is not a race
#      (the two are sequential, not simultaneous: this workflow's own push
#      event fires at merge time, before docouture-release.yml's job even
#      starts), just a redundant rebuild. `check-release-label` (below)
#      closes that gap directly: if the commit that triggered this push came
#      from a merged pull request carrying the docs/release label,
#      docouture-release.yml is already about to publish the definitive
#      post-release build itself, so this workflow skips rather than
#      duplicate it. (Only reachable at all in a trunk-based site, where the
#      prerelease and release branches are the same one — under git-flow
#      they're different branches, so a docs/release-labeled PR never
#      targets the prerelease branch this workflow watches.)
#
# Docouture hardening: pinned actions, no persisted checkout credentials,
# no third-party path filter (a plain `git diff` over the pushed range does
# the same job), and the App key passed to docouture-publish.yml as an
# explicit secret rather than `secrets: inherit`.
on:
  push:
    branches: ['main*']

permissions: {}

concurrency:
  group: docouture-publish-prerelease
  cancel-in-progress: true

jobs:
  check-changes-in-paths:
    name: Check for changes in corresponding paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      detected: ${{ steps.changes.outputs.paths }}
    steps:
      # The diff below runs over github.event.before -> github.sha in local
      # git history, so it needs an actual checkout first. fetch-depth 0
      # rather than a shallow default: a batched push can carry more commits
      # than a shallow clone's history would contain, and `before` must be
      # reachable locally for the diff to succeed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # docs/.release-version is deliberately NOT listed — see this file's
      # own header comment, point 1. A push whose `before` is missing (a new
      # branch, or history rewritten by a force-push) counts as changed, so
      # content is never silently left unpublished.
      - name: Check for changed files in specific paths
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "paths=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$AFTER" -- \
            'docs/src/' 'docs/antora-playbook*.yml' 'docs/supplemental-ui/')"
          if [ -n "$changed" ]; then
            echo "paths=true" >> "$GITHUB_OUTPUT"
          else
            echo "paths=false" >> "$GITHUB_OUTPUT"
          fi

  check-release-label:
    name: Check for docs/release label on the triggering pull request
    needs: check-changes-in-paths
    if: needs.check-changes-in-paths.outputs.detected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Read the labels of the pull request behind this push.
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # Resolves the merged pull request (if any) that produced this push's
      # HEAD commit, regardless of merge strategy (merge commit, squash, or
      # rebase) — GitHub tracks this association itself rather than this
      # step having to guess from the SHA, see
      # https://docs.github.com/en/rest/commits/commits#list-pull-requests-associated-with-a-commit.
      # A direct push to the prerelease branch with no associated pull
      # request (e.g. an admin pushing straight to it) simply resolves no
      # labels and is never skipped here.
      - name: Check for docs/release label
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          labels=$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
            --jq '.[0].labels[].name' 2>/dev/null || echo "")

          if echo "$labels" | grep -qx 'docs/release'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This push came from a docs/release-labeled merge — docouture-release.yml will publish the definitive build itself, skipping here."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish
    needs: [check-changes-in-paths, check-release-label]
    if: needs.check-changes-in-paths.outputs.detected == 'true' && needs.check-release-label.outputs.skip != 'true'
    # A reusable workflow can never be granted more than its caller job
    # holds. docouture-publish.yml only needs to read the repository: its
    # gh-pages push authenticates with the App token it mints itself.
    permissions:
      contents: read # Grant docouture-publish.yml its checkout read access.
    uses: ./.github/workflows/docouture-publish.yml
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
