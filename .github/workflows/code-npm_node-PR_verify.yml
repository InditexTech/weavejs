---
name: code-npm-PR-verify

concurrency:
  group: code-PR-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/code*"

# No admin-permission gate here, unlike the publish workflow: this job runs on
# `pull_request`, so fork PRs get no secrets and a read-only token, and the
# repository's fork-PR approval policy decides whether it runs at all. An
# admin gate keyed on the PR author would only fail every external PR.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Code / Verify
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      ASDF_BRANCH_VERSION: 0.18.0
    steps:
      - name: Checkout / Branch Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: NPM / Setup Dependencies Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('code/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: asdf / Setup Dependencies Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: asdf-cache
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-asdf-${{ env.ASDF_BRANCH_VERSION }}-${{ hashFiles('code/.tool-versions') }}

      - name: Save tool-versions content
        run: |
          {
            echo "TOOL_VERSIONS<<EOF"
            cat code/.tool-versions
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: NPM / Setup asdf environment
        uses: asdf-vm/actions/install@1902764435ca0dd2f3388eea723a4f92a4eb8302 # v4.0.0
        # https://github.com/asdf-vm/actions/issues/356
        if: steps.asdf-cache.outputs.cache-hit != 'true'
        with:
          tool_versions: ${{ env.TOOL_VERSIONS }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: NPM / Create Cache Folders
        run: |
          mkdir -p "$HOME"/.npm

      # Catches invisible Unicode whitespace (e.g. a pasted-in NBSP) before
      # it reaches CHANGELOG.md's [Unreleased] section — that whitespace
      # breaks release-flow/keep-a-changelog-action's markdown parsing of
      # the heading it sits in, which then gets corrupted with a stray
      # backslash escape on every future release. See
      # .github/scripts/sanitize-changelog.mjs for the full story.
      - name: Verify CHANGELOG.md has no invisible whitespace
        run: node .github/scripts/sanitize-changelog.mjs code/CHANGELOG.md --check

      - name: NPM / Verify
        working-directory: code
        run: |
          npm run verify

      - name: Store project information
        id: version
        run: |
          echo "app-version=$(jq ".version" code/package.json)" >> "$GITHUB_OUTPUT"
          echo "app-name=$(yq -oy '.name' code/package.json)" >> "$GITHUB_OUTPUT"
          echo "github-repository=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)" >> "$GITHUB_OUTPUT"
