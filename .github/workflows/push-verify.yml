name: Push Verification
permissions:
  contents: read

on:
  push:

concurrency:
  group: push-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-quality:
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    name: Workflow and Template Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@320fcdd9c860767cf17fab3b20e22e739d5d02b8 # v1.76.0
        with:
          reporter: github-annotations
          fail_level: error

  repo-linter:
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    name: Repo Linter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run Repolinter'
        uses: newrelic/repolinter-action@3f4448f855c351e9695b24524a4111c7847b84cb # v1.7.0

  reuse-compliance:
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    name: REUSE Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
