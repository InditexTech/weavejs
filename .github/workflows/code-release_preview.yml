---
name: code-release-preview

concurrency:
  # Scoped per-PR, not just per-workflow, so a label change on one pull
  # request never cancels the preview of another.
  group: release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review, opened]
    branches: ['main', 'main-*']

env:
  PR_HEAD_REF: ${{ github.head_ref }}

jobs:
  check-changes-in-paths:
    name: Check for changes in corresponding paths
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.draft == false || contains(join(github.event.pull_request.labels.*.name, ', '), 'release-type') || contains(join(github.event.pull_request.labels.*.name, ', '), 'release-preview') }}
    outputs:
      detected: ${{ steps.changes.outputs.paths }}
    steps:
      - name: Check for changed files in specific paths
        id: changes
        uses: dorny/paths-filter@ebc4d7e9ebcb0b1eb21480bb8f43113e996ac77a
        with:
          filters: |
            paths:
              - 'code/**'
              - '.github/workflows/code*'

  release-preview:
    name: Release Preview
    permissions:
      contents: read
      issues: read
      pull-requests: write
    needs: check-changes-in-paths
    if: ${{ (contains(join(github.event.pull_request.labels.*.name, ', '), 'release-type') || contains(join(github.event.pull_request.labels.*.name, ', '), 'release-preview')) && needs.check-changes-in-paths.outputs.detected == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup hotfix release type version and simulate merge
        if: ${{ contains(github.event.pull_request.labels.*.name, 'release-type/hotfix') }}
        run: echo "RELEASE_VERSION=patch" >> "$GITHUB_ENV"

      - name: Setup multi-hotfix release type version
        if: contains(github.event.pull_request.labels.*.name, 'release-type/multi-hotfix')
        run:  echo "RELEASE_VERSION=patch" >> "$GITHUB_ENV"

      - name: Setup patch release type version
        if: contains(github.event.pull_request.labels.*.name, 'release-type/patch')
        run: echo "RELEASE_VERSION=patch" >> "$GITHUB_ENV"

      - name: Setup minor release type version
        if: contains(github.event.pull_request.labels.*.name, 'release-type/minor')
        run: echo "RELEASE_VERSION=minor" >> "$GITHUB_ENV"

      - name: Setup major release type version
        if: contains(github.event.pull_request.labels.*.name, 'release-type/major')
        run: echo "RELEASE_VERSION=major" >> "$GITHUB_ENV"

      - name: Check merge strategy
        run: |
          if [[ "$PR_HEAD_REF" == hotfix* && "${{ contains(github.event.pull_request.labels.*.name, 'release-type/multi-hotfix') }}" != "true" ]] ;
          then
              echo "MERGE_STRATEGY=Squash and Merge" >> "$GITHUB_ENV"
          elif [[ "${{vars.DEVELOPMENT_FLOW}}" == 'trunk-based-development' && ("$PR_HEAD_REF" == hotfix* && "${{ contains(github.event.pull_request.labels.*.name, 'release-type/multi-hotfix') }}" == "true") ]] ;
          then
              echo "MERGE_STRATEGY=Create a merge commit" >> "$GITHUB_ENV"
          elif [[ "${{ vars.DEVELOPMENT_FLOW }}" == 'trunk-based-development' ]] ;
          then
              echo "MERGE_STRATEGY=Squash and Merge" >> "$GITHUB_ENV"
          else
              echo "MERGE_STRATEGY=Create a merge commit" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version-file: code/.tool-versions

      # Same script as the release job. Into the local [Unreleased] it writes
      # the entries already pending on the base branch (PRs merged since the
      # last release tag, usually with skip-release) and then this PR's, so
      # the bump below previews the whole release. HEAD is the merge commit,
      # so HEAD^1 is the base branch. Whether the PR is linked at all is
      # checked by code-changelog-check.yml.
      - name: Generate CHANGELOG.md entries for the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          node .github/scripts/changelog-from-prs.mjs --to HEAD^1 --branch "$BASE_REF" \
            --changelog code/CHANGELOG.md --report "$GITHUB_STEP_SUMMARY"
          node .github/scripts/changelog-from-prs.mjs --pr "$PR_NUMBER" \
            --changelog code/CHANGELOG.md --report "$RUNNER_TEMP/changelog-report.md"

      - name: Update CHANGELOG.md
        id: update-changelog
        uses: release-flow/keep-a-changelog-action@v3.0.0
        with:
          command: bump
          version: ${{ env.RELEASE_VERSION }}
          changelog: code/CHANGELOG.md
          fail-on-empty-release-notes: false
          keep-unreleased-section: true
          tag-prefix: ""

      - name: Build release preview
        env:
          NEXT_VERSION: ${{ steps.update-changelog.outputs.version }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          TASKS=$(awk -v version="$NEXT_VERSION" '
            BEGIN { capture=0; found_version=0 }
            $0 ~ "## \\[" version "\\] -" { capture=1; found_version=1; print; next }
            capture && $0 ~ /^## \[.*\] -/ { capture=0 }
            capture { print }
            END {
              if (found_version) {
                while ((getline line < "code/CHANGELOG.md") > 0) {
                  if (line ~ /^\[.*\]:/) {
                    print line
                  }
                }
              }
            }
          ' code/CHANGELOG.md)
          {
            echo "### :rocket: Release Preview Success"
            echo "You are going to release the version **${NEXT_VERSION}** (${RELEASE_VERSION}) with the following changes:"
            echo "$TASKS"
            echo ""
            cat "$RUNNER_TEMP/changelog-report.md"
            echo ""
            echo "### 💡 Merge Strategy: $MERGE_STRATEGY"
            echo ""
            echo "Remember to use the **'$MERGE_STRATEGY'** strategy to merge this _Pull Request (\`$PR_HEAD_REF\` → \`$BASE_REF\`)_."
            echo ""
            echo "_With the \`skip-release\` label, merging publishes no release: the entries of the issues this PR closes go into the next release. Without a linked issue, the PR gets no entry._"
          } > "$RUNNER_TEMP/release-preview.md"

      # Fork PRs get a read-only GITHUB_TOKEN, so `gh pr comment` cannot post:
      # the preview goes to the job summary instead.
      - name: Add PR comment with release preview
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/release-preview.md"

      - name: Add release preview to the job summary
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: cat "$RUNNER_TEMP/release-preview.md" >> "$GITHUB_STEP_SUMMARY"

  release-preview-no-code-changes:
    name: Add PR comment with configuration management information
    permissions:
      contents: read
      pull-requests: write
    needs: check-changes-in-paths
    # Comment-only job: skipped on fork PRs, whose read-only GITHUB_TOKEN cannot comment.
    if: ${{ (contains(join(github.event.pull_request.labels.*.name, ', '), 'release-type') || (contains(join(github.event.pull_request.labels.*.name, ', '), 'release-preview'))) && needs.check-changes-in-paths.outputs.detected == 'false' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Add PR comment with release preview
        run: |
          BODY="
          ### :exclamation: :exclamation: :exclamation: This Pull Request will not trigger a Release
          A Pull Request with no changes to the  \`code/\` folder will not trigger a release"

          gh pr comment ${{ github.event.number }} --body "$BODY"

  release-preview-no-release-labels:
    name: Add PR comment with release information
    permissions:
      contents: read
      pull-requests: write
    needs: check-changes-in-paths
    # Comment-only job: skipped on fork PRs, whose read-only GITHUB_TOKEN cannot comment.
    if: ${{ !contains(join(github.event.pull_request.labels.*.name, ', '), 'release-type') && needs.check-changes-in-paths.outputs.detected == 'true' && github.event.pull_request.draft == false && vars.DEVELOPMENT_FLOW != 'trunk-based-development' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Add PR comment with release preview
        run: |
          gh pr comment ${{ github.event.number }} --body "
          ### :exclamation: :exclamation: :exclamation: This Pull Request will not trigger a Release
          A Pull Request with no \`release-type/...\` labels will not trigger a release, so you need to label this PR if you want to create a release.
          "
