name: docouture-release

# Handles BOTH versioning modes — see the docouture docs-site-package skill's
# versioning-modes.md for the full mechanism. Which mode a site is on is
# detected, not asked: `docs/antora-playbook.yml`'s own content.sources[]
# tags permanently say `tags: ['docs/v*']` under versioned (Full History) or
# `tags: ['docs/stable']` under standalone (Stable + Prerelease) from the moment a
# site opts into either — see the `Detect mode` step below. `docs/antora.yml`
# on the release branch is identical for both modes (`version: prerelease`,
# `prerelease: true`) and is never read for this. Adopting a mode in the
# first place (setting antora-playbook.yml's content.sources[] tags/branches)
# is still a manual, one-time edit; this workflow only handles cutting
# releases afterwards.
#
# Prerequisite, done once, not by this workflow: this site's own
# antora-playbook.yml content.sources[] must already match
# `branches: [main]` + `tags: ['docs/v*']` (versioned) or
# `branches: [main]` + `tags: ['docs/stable']` (standalone) —
# see the guides-branching-model guide for what the prerelease/release
# branch roles mean (trunk-based: both the same branch; git-flow: two
# independently-named branches, e.g. `develop`/`main`).
#
# Three ways to run this, all deliberate acts rather than a side effect of an
# ordinary push:
#
#   1. workflow_dispatch — a person runs it by hand and supplies `version`
#      (versioned) or leaves it as the default (standalone).
#   2. Automatically, when a pull request carrying the `docs/release` label
#      is merged into a branch matching the release branch (see the
#      guides-branching-model guide). This path has no input to
#      type a version into: standalone doesn't need one (always `docs/stable`);
#      versioned reads it from `docs/.release-version`, a plain-text file
#      the PR itself commits with the target version — reviewed as part of
#      that PR's diff, like any other change.
#   3. Automatically, whenever a GitHub Release is published on this repo.
#      Irrelevant unless this repo ALSO cuts its own code releases some other
#      way, labelling the merged PR `release-type/*` (optionally
#      `skip-release`) the way docouture's own repo does — nothing scaffolds
#      that convention here, so on a fresh `docouture new` site this trigger
#      simply never fires and the job below always takes path #2 instead.
#      Kept anyway, disabled by omission rather than left out, so adopting
#      that convention later is a label/workflow change only, not a rewrite
#      of this file too.
#
#      Where it does apply: this overlaps with #2 — a single merged PR can
#      carry BOTH `docs/release` and a `release-type/*` label (releasing
#      code and docs together). If it did, and #2 fired unconditionally,
#      this workflow would run twice for the one merge — once immediately
#      (the `pull_request` close) and again once that other release job
#      finishes and publishes its Release (the trigger added here). The
#      job's own `if:` below avoids that: the `pull_request` branch only
#      fires when a code release is NOT also about to happen for the same
#      merge (no `release-type/*` label, or `skip-release` overrides it) —
#      otherwise it backs off and leaves the job to trigger #3 instead, once
#      that other workflow actually finishes. Either way this runs exactly
#      once per merge, just not always at the same moment.
#
# Git-flow (versioned only): the descriptor bump below lands on the release
# branch, so the `sync-prerelease` job opens a pull request carrying it into
# the prerelease branch (name read from docs/package.json's
# `docouture.prereleaseBranch`, with `docouture.branching` as the flow
# signal; both kept in sync by `docouture new`/`branch-model`/`upgrade`).
# It runs before `publish`, but `publish` runs whenever `release` succeeded —
# a failed sync turns the run red without blocking the docs. Trunk-based
# sites skip it. The GitHub App needs `pull-requests: write` for this.
#
# Republishing (versioned only): a fix that needs to land on an
# already-released version overwrites that version's tag — this workflow
# always force-recreates a tag that already exists, both modes, no separate
# flag or label needed. `docs/.release-version` itself is never cleared by
# hand: after every successful versioned release that is NOT a republish,
# this workflow bumps it forward to the next patch version on the release
# branch (see "Bump release descriptor" below), so the file always holds a
# sane next target rather than going stale. A republish (the target tag
# already existed) skips that bump, since `docs/.release-version` already
# holds whatever was planned to come after it.
#
# Docouture hardening, on top of the docouture scaffold:
#   - GITHUB_TOKEN is read-only. Every push (the release tag, the versioned
#     descriptor bump) already authenticates with the App token configured in
#     "Git app credentials", and that token is narrowed to this repository
#     and to contents: write.
#   - Every action is pinned to a full-length commit SHA.
#   - No dependency or Kroki image cache is restored: this job cuts a release,
#     and a cache another run wrote is a poisoning vector for anything that
#     ships (zizmor's cache-poisoning audit). The build pulls Kroki cold.
#   - The App private key reaches docouture-publish.yml as an explicit
#     secret, never `secrets: inherit`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Target version for a versioned release, e.g. 1.2.0 (becomes tag
          docs/v1.2.0). Leave as 'stable' for a standalone site — that mode's
          target is always the 'docs/stable' tag, this input is ignored there.
        required: true
        type: string
        default: 'stable'
  pull_request:
    types: [closed]
    branches: ['main*']
  release:
    types: [published]

permissions: {}

concurrency:
  group: docouture-release
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Check out the release branch; pushes use the App token.
    # Consumed by the `sync-prerelease` job below. `bumped` is only 'true'
    # when "Bump release descriptor" actually moved docs/.release-version
    # (a genuine forward versioned release, never a republish).
    outputs:
      branching: ${{ steps.flow.outputs.branching }}
      prerelease_branch: ${{ steps.flow.outputs.prerelease_branch }}
      version: ${{ steps.resolve.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    # `docouture new` scaffolds this site's package.json, antora-playbook.yml,
    # docs/antora.yml etc. under docs/ (not the repository root) — see the
    # docs-site-package skill's reference/versioning-modes.md. Every step
    # below — including the git ones, so `docs/antora.yml` below really
    # means the descriptor at docs/src/antora.yml relative to the repo
    # root — runs from there; only .github/workflows itself has to live at
    # the true repo root, since that is the one path GitHub Actions
    # requires.
    defaults:
      run:
        working-directory: docs
    # workflow_dispatch and a published Release both always proceed (already
    # explicit, deliberate acts), except a GitHub pre-release: publishing a
    # preview must never move the stable docs tag. The pull_request trigger fires on every
    # close of a PR targeting the release branch — including ones that were
    # closed unmerged, or merged without the label — so it only proceeds
    # when merged, carrying `docs/release`, AND a same-merge code release is
    # NOT also about to fire under the `release-type`/`skip-release`
    # convention (see this file's own header comment on trigger #2/#3 — a
    # no-op on a site that doesn't use that convention, since
    # `release-type`/`skip-release` labels then never exist to contain).
    # Anything else is a no-op run, not an error.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'docs/release') &&
        (contains(github.event.pull_request.labels.*.name, 'skip-release') ||
          !contains(join(github.event.pull_request.labels.*.name, ', '), 'release-type')))
    steps:
      - name: Require release branch
        # Only meaningful for a manual dispatch: someone could run this
        # workflow with a different branch selected in the "Run workflow"
        # UI. The pull_request trigger can't have this problem — the
        # `branches:` filter above already restricted it to the release
        # branch before the job started, and by the time a `closed`+`merged`
        # event fires, that branch already reflects the merge.
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::docouture-release must run against main (got $REF)"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Standalone moves an existing `docs/stable` tag, which has to already
          # be reachable in history to be force-moved. Versioned only ever
          # creates a brand-new tag on a brand-new commit and doesn't
          # strictly need this, but the detect step below needs the release
          # branch's tip either way, and full history is harmless for that
          # case.
          fetch-depth: 0
          ref: main
          # Don't persist the ambient GITHUB_TOKEN's credentials — it isn't
          # on this repo's branch-ruleset bypass list, and a local credential
          # from actions/checkout would otherwise win over the app token's
          # own credentials (set up below) when the git-push steps run.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Reads engines.node from docs/package.json — no separate version
          # file to keep in sync.
          node-version-file: docs/package.json

          # See the header: no caches in this workflow, and setup-node itself
          # never manages the cache here.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Nothing before this point has actually built the docs — unlike
      # docouture-pr-verify.yml and docouture-publish.yml, this workflow previously
      # went straight from install to cutting a release tag. That let a
      # broken site get tagged and released, only to be caught later, when
      # the tag push triggers docouture-publish.yml downstream. Building here
      # too, before any git mutation below, catches it before a tag or
      # GitHub Release ever exists for it.
      #
      # `antora-playbook.local.yml` (branches: HEAD), not the real
      # antora-playbook.yml: the tag this run is about to cut doesn't exist
      # yet, so the real playbook's tag-based content source can't see it —
      # it would just rebuild whatever was already released, not what's
      # about to ship. The local playbook validates exactly the content on
      # the release branch right now, which is what the new version will
      # actually be.
      - name: Build docs
        run: npx antora --fetch antora-playbook.local.yml

      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Mints an installation token for a GitHub App that's on this repo's
      # branch-ruleset bypass list, if the release branch/`gh-pages` are
      # protected by one (branch rulesets requiring PRs / status checks) —
      # see issue #157 in InditexTech/docouture. `Push release tag` and
      # `Bump release descriptor` below both push straight to a branch/ref,
      # and the plain GITHUB_TOKEN identity is never on a ruleset's own
      # bypass list, so those pushes are rejected (GH013) on a protected
      # repo without this.
      # `APP_CLIENT_ID` (a variable) and `APP_PRIVATE_KEY` (a secret) are
      # organization-level in InditexTech — set both at the org or repo
      # level for whichever GitHub App is bypass-listed on this site's rules.
      - name: Git app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Git app credentials
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${APP_TOKEN}@github.com" >> ~/.git-credentials

      # The one signal this workflow trusts: docs/antora-playbook.yml's own
      # content.sources[] tags permanently say `tags: ['docs/v*']` (versioned) or
      # `tags: ['docs/stable']` (standalone) from the moment a site opts into that
      # mode — see this file's header and versioning-modes.md. Anything else
      # there is treated as misconfiguration, not a third mode. Unlike
      # docs/antora.yml elsewhere in this job — which really means
      # docs/src/antora.yml relative to the repo root, per this job's own
      # working-directory comment above — antora-playbook.yml sits directly
      # under docs/ (one level, not nested), so it's read here bare, without
      # a docs/ prefix.
      - name: Detect mode
        id: detect
        run: |
          line=$(grep -E "tags:" antora-playbook.yml | head -1)

          case "$line" in
            *"v*"*) mode=versioned ;;
            *stable*) mode=standalone ;;
            *)
              echo "::error::antora-playbook.yml's content.sources[] has tags: '${line}' — expected something matching 'docs/v*' (versioned) or 'docs/stable' (standalone). See versioning-modes.md's 'Prerequisite' note."
              exit 1
              ;;
          esac

          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "Detected ${mode} (antora-playbook.yml: ${line})"

      # The flow (trunk-based or git-flow) and, under git-flow, the prerelease
      # branch name come from docs/package.json's `docouture` block — one
      # declared source, kept in sync by `docouture new`, `branch-model` and
      # `upgrade`. A missing `branching` is a site that predates the field:
      # treated as trunk-based. git-flow without `prereleaseBranch` fails here,
      # before any tag is pushed, since the sync PR below has no target.
      - name: Detect flow
        id: flow
        env:
          MODE: ${{ steps.detect.outputs.mode }}
        run: |
          branching=$(node -p "require('./package.json').docouture?.branching ?? ''")
          prerelease=$(node -p "require('./package.json').docouture?.prereleaseBranch ?? ''")

          if [ "$branching" = "git-flow" ] && [ -z "$prerelease" ] && [ "$MODE" = "versioned" ]; then
            echo "::error::docs/package.json declares docouture.branching 'git-flow' but no docouture.prereleaseBranch — run 'docouture upgrade' to add it (the prerelease branch needs a sync PR carrying the docs/.release-version bump)."
            exit 1
          fi

          echo "branching=${branching:-trunk-based}" >> "$GITHUB_OUTPUT"
          echo "prerelease_branch=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Detected flow '${branching:-trunk-based}' (prerelease branch '${prerelease}')"

      # Where the target version comes from depends on how this run started:
      # a person typed it (workflow_dispatch) or the merged PR committed it
      # (docs/.release-version). Standalone ignores whatever this resolves to
      # either way — it always targets `stable` — but it's still resolved
      # uniformly here so later steps don't need to know which trigger fired.
      - name: Resolve version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
            source="workflow_dispatch input"
          elif [ -f .release-version ]; then
            version=$(tr -d '[:space:]' < .release-version)
            source="docs/.release-version"
          else
            version=""
            source="docs/.release-version (missing)"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version '${version}' from ${source}"

      - name: Validate version
        env:
          MODE: ${{ steps.detect.outputs.mode }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if [ "$MODE" = "versioned" ] && [ -z "$VERSION" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::Versioned mode requires a real target version — re-run with a 'version' input other than the default 'stable', e.g. 1.2.0."
            else
              echo "::error::Versioned mode requires a real target version, and this PR carried no docs/.release-version — add that file with the target version (e.g. 1.2.0) before merging with the docs/release label, or run docouture-release manually via workflow_dispatch instead."
            fi
            exit 1
          fi

          if [ "$MODE" = "versioned" ] && [ "$VERSION" = "stable" ]; then
            echo "::error::'stable' is standalone's target name, not a valid versioned-mode version — use a real version, e.g. 1.2.0."
            exit 1
          fi

          # Full SemVer 2.0.0 grammar (semver.org's own regex, rewritten with
          # plain groups instead of `(?:...)` — bash's [[ =~ ]] runs glibc
          # POSIX ERE, not PCRE, and doesn't understand non-capturing
          # groups). Catches a hand-edited docs/.release-version (or a typo'd
          # workflow_dispatch input) BEFORE any tag is pushed below — without
          # this, a malformed value sails through here, tags and pushes fine
          # in "Cut release"/"Push release tag", and only fails later inside
          # "Bump release descriptor" (npm's `version patch` rejects
          # non-semver input) — by which point the tag already exists but the
          # job as a whole reads as failed, so the `publish` job below never
          # runs. Prerelease/build-metadata suffixes (1.2.0-beta.1,
          # 1.2.0+build) are valid SemVer and accepted; a leading 'v' or a
          # bare '1.2' are not.
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          if [ "$MODE" = "versioned" ] && [ -n "$VERSION" ] && ! [[ "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::docs/.release-version (or the 'version' input) must be a valid SemVer version like 1.2.0 — got '${VERSION}'. See https://semver.org — prerelease/build metadata (1.2.0-beta.1, 1.2.0+build) is fine, a leading 'v' or a two-part '1.2' is not."
            exit 1
          fi

          if [ "$MODE" = "standalone" ] && [ -n "$VERSION" ] && [ "$VERSION" != "stable" ]; then
            echo "::warning::Standalone mode always releases to the 'stable' tag — ignoring provided version '${VERSION}'."
          fi

      # The release branch's own docs/antora.yml is never touched here — it
      # permanently says version: prerelease (both modes, trunk-based only
      # — see the guides-branching-model guide for why this steady-state
      # value stops being meaningful once the release branch is a distinct,
      # git-flow branch: nothing reads it back in that case either way).
      # This step patches a COMMIT, not the release branch itself:
      # `docouture version <value>` edits the working tree, that edit is
      # committed on top of the release branch's current tip, and then the
      # release branch is reset back to that same tip immediately after —
      # so the commit's only route into the repository's reachable history
      # is whichever tag points at it next (pushed in the following step).
      # It is deliberately never pushed as part of the release branch.
      - name: Cut release
        id: cut
        env:
          MODE: ${{ steps.detect.outputs.mode }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if [ "$MODE" = "versioned" ]; then
            value="$VERSION"
            tag="docs/v${value}"
          else
            value="stable"
            tag="docs/stable"
          fi

          base=$(git rev-parse HEAD)

          npx docouture version "$value"
          git add src/antora.yml
          git commit -m "chore: docs release ${tag}"
          sha=$(git rev-parse HEAD)

          # Detach the release branch back to its real tip. The commit just
          # made keeps existing (git doesn't garbage-collect same-run
          # objects), it's just no longer what any local branch points at.
          git reset --hard "$base"

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Versioned only: whether this exact version was released before
      # decides whether "Bump release descriptor" below runs — a republish
      # (the tag already existed) must NOT bump docs/.release-version
      # forward, since that file already holds whatever was planned to come
      # after this republished version. Standalone has no equivalent need —
      # `docs/stable` is a rolling pointer, always overwritten, and there's no
      # release-version file to protect.
      - name: Check for existing release
        if: steps.detect.outputs.mode == 'versioned'
        id: check
        env:
          TAG: ${{ steps.cut.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "existed=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} already exists — republishing (force)."
          else
            echo "existed=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} is new."
          fi

      # Every release tag is force-recreated if it already exists — both
      # modes, unconditionally. Standalone's `docs/stable` is a rolling pointer by
      # design; versioned's docs/vX.Y.Z tags are meant to be immutable once
      # released, but a republish (fixing a released version) is a
      # deliberate, ordinary act here, not something gated behind a separate
      # flag or label.
      - name: Push release tag
        env:
          TAG: ${{ steps.cut.outputs.tag }}
          SHA: ${{ steps.cut.outputs.sha }}
        run: |
          git tag -f "$TAG" "$SHA"
          git push origin "refs/tags/${TAG}" --force

      # Neither mode creates a GitHub Release object — `Push release tag` above
      # is the last step of this dance for both. Versioned mode used to
      # (`gh release create --generate-notes` here, deleting-then-recreating
      # on a republish), but that Release was functionally inert: nothing
      # reads it back — no workflow, no Antora extension, no CLI command; the
      # version dropdown and `duplicate_latest_version` are driven purely by
      # the tag itself plus Antora's own ref aggregation (see
      # versioning-modes.md) — and it polluted the same Releases page/RSS/
      # watch feed as this repo's real npm semver releases
      # (code-npm_node-publish-release-and-snapshot.yml), which #166's `docs/`
      # tag prefix alone didn't fully solve: a Release object still shows in
      # that list regardless of what its tag is named. `--generate-notes`'s
      # auto PR-list was dropped outright rather than relocated when this was
      # removed — its value is already covered by the hand-authored
      # `release-notes/<version>.adoc` page and the auto-generated
      # `changelog/index.adoc` (built from CHANGELOG.md at build time). See
      # GH #172.

      # Versioned only, and only on a genuine forward release (not a
      # republish of an already-released version — see "Check for existing
      # release" above): docs/.release-version needs a sane value again
      # immediately or the next docs/release merge has nothing to read (see
      # "Validate version" above). Rather than clearing it, bump it forward
      # one patch version — the same idiom `just bump` uses for this
      # workspace's own npm packages: let `npm version` do the semver
      # arithmetic against a throwaway package.json instead of hand-rolling
      # it, then read the result back out. This is a real commit directly on
      # the release branch (unlike "Cut release" above, which deliberately
      # never advances it) — it's just bookkeeping, not a release. Skipped
      # on a republish: that run's target version was already superseded by
      # whatever docs/.release-version currently holds, so bumping forward
      # from it would clobber that already-planned next target instead of
      # protecting it.
      - name: Bump release descriptor
        id: bump
        if: steps.detect.outputs.mode == 'versioned' && steps.check.outputs.existed != 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          dir=$(mktemp -d)
          echo '{"name":"docs-release-version","version":"'"${VERSION}"'"}' > "${dir}/package.json"
          npm --prefix "${dir}" version patch --no-git-tag-version --loglevel error >/dev/null
          next=$(node -p "require('${dir}/package.json').version")

          echo "${next}" > .release-version
          git add .release-version
          git commit -m "chore: bump docs/.release-version to ${next}"
          git push origin main

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "docs/.release-version: ${VERSION} → ${next}"

  # Git-flow only: the bump above lands on the release branch, so the
  # prerelease branch would otherwise keep the old docs/.release-version
  # forever (and conflict on the next release PR). This opens a PR carrying
  # the release branch into the prerelease branch instead of pushing to it
  # directly — a conflict shows up in the PR, not silently. It runs before
  # `publish`, but `publish` does not depend on its result (see below): a
  # failed sync turns this run red without holding the docs back.
  sync-prerelease:
    name: Sync prerelease branch
    needs: release
    if: >-
      needs.release.result == 'success' &&
      needs.release.outputs.branching == 'git-flow' &&
      needs.release.outputs.bumped == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Pushes and PRs use the App token.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      # `workflows: write` because the release branch may carry workflow-file
      # changes the prerelease branch lacks, and git refuses that push without
      # it. The App itself needs these permissions granted too.
      - name: Git app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Open sync pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: main
          PRERELEASE_BRANCH: ${{ needs.release.outputs.prerelease_branch }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code --heads origin "$PRERELEASE_BRANCH" >/dev/null 2>&1; then
            echo "::notice title=Sync skipped::The ${PRERELEASE_BRANCH} branch does not exist."
            exit 0
          fi

          git fetch --no-tags origin "$RELEASE_BRANCH" "$PRERELEASE_BRANCH"

          if git merge-base --is-ancestor "origin/${RELEASE_BRANCH}" "origin/${PRERELEASE_BRANCH}"; then
            echo "::notice title=Sync skipped::${PRERELEASE_BRANCH} already contains ${RELEASE_BRANCH}."
            exit 0
          fi

          sync_branch="automated/sync-docs-release-${VERSION}-to-${PRERELEASE_BRANCH}"
          git switch --force-create "$sync_branch" "origin/${RELEASE_BRANCH}"

          if existing=$(git ls-remote --heads origin "$sync_branch" | cut -f1) && [ -n "$existing" ]; then
            git push --force-with-lease="refs/heads/${sync_branch}:${existing}" origin "HEAD:refs/heads/${sync_branch}"
          else
            git push origin "HEAD:refs/heads/${sync_branch}"
          fi

          find_existing_pr() {
            gh pr list --repo "$GITHUB_REPOSITORY" --head "$sync_branch" --base "$PRERELEASE_BRANCH" \
              --state open --json number --jq '.[0].number // empty'
          }

          if [ -n "$(find_existing_pr)" ]; then
            echo "Sync PR already open — branch updated."
            exit 0
          fi

          create_args=(pr create --repo "$GITHUB_REPOSITORY" --base "$PRERELEASE_BRANCH" --head "$sync_branch"
            --title "Sync docs release ${VERSION} to ${PRERELEASE_BRANCH}"
            --body "**Automated pull request** syncing the docs release cut on \`${RELEASE_BRANCH}\` (including the docs/.release-version bump) back into \`${PRERELEASE_BRANCH}\`.")
          if gh label list --repo "$GITHUB_REPOSITORY" --search kind/internal --json name \
            --jq 'any(.[]; .name == "kind/internal")' | grep -qx true; then
            create_args+=(--label kind/internal)
          fi

          for attempt in 1 2 3; do
            if create_output=$(gh "${create_args[@]}" 2>&1); then
              printf '%s\n' "$create_output"
              exit 0
            else
              status=$?
            fi
            # A 5xx can arrive after GitHub committed the mutation: look for
            # the PR before retrying, never create blindly.
            if [ -n "$(find_existing_pr)" ]; then
              echo "::notice title=Sync PR reconciled::PR exists after a failed create request."
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && [[ "$create_output" =~ HTTP\ (500|502|503|504) ]]; then
              sleep "$((attempt * 5))"
              continue
            fi
            printf '%s\n' "$create_output" >&2
            exit "$status"
          done

      - name: Comment on release pull request after failure
        if: failure() && github.event_name == 'pull_request' && steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" \
            --body "Syncing this docs release to the prerelease branch failed. Docs were still published. See the [workflow log](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."

      # Rebuild/deploy: called directly here, as a reusable job, rather than
      # relying on docouture-publish.yml's own trigger reacting to the pushes
      # above — a plain `on: push` there previously had two problems: (1) it
      # matched both the tag push above AND the release branch's ordinary
      # pushes, so an unrelated commit to it (or this job's own
      # release-version bump commit, previously pushed to it directly)
      # could kick off a publish with nothing to do with a release, and (2)
      # both this job's tag push and its release-branch push could each
      # independently match, firing publish twice for one release with no
      # ordering guarantee between them. A direct `needs:` job dependency
      # below has neither problem: publish only ever runs once, only after
      # this job finishes, and only when it actually cut something
      # (`needs.release.result == 'success'` is already false for a no-op
      # run — see this job's own `if:` above, which makes a run that
      # doesn't match skip rather than succeed).
  publish:
    name: Publish
    needs: [release, sync-prerelease]
    # `always()` so a failed or skipped sync-prerelease never blocks the
    # docs from being published: publishing is the user-facing outcome, the
    # sync PR can be repaired afterwards.
    if: always() && needs.release.result == 'success'
    permissions:
      contents: read # Grant docouture-publish.yml its checkout read access.
    uses: ./.github/workflows/docouture-publish.yml
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
