# SonarQube Cloud (SonarCloud) project settings for the governed analysis lane
# (scanner runs from the repository root; workflow -D args override identity and
# scope). This file only carries analysis policy that cannot be expressed in the
# workflow.

# The create-*app CLIs intentionally write into a user-specified output
# directory (segment-validated before any file operation): documented false
# positive for tssecurity:S8707 (see governance PR #1178).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=**/create-app.ts

# Generator sources have no test harness (they scaffold end-user projects);
# exclude them from coverage and duplication measurement, as the previous
# product configuration did.
sonar.coverage.exclusions=**/create-*/src/**,**/create-*/tsdown.config.ts
sonar.cpd.exclusions=**/create-backend-app/**,**/create-frontend-app/**,**/tsdown.config.ts,**/vitest.config.ts,**/vitest.setup.ts,**/__tests__/**,**/*.test.ts
