# The component name is the site's first URL segment: pages live at
# /weavejs/<module>/<page>, and this component's ROOT pages — the landing —
# directly at /weavejs/. It has nothing to do with the `docs/` directory this
# file sits in, which Antora never puts in a URL.
name: weavejs
title: Weave.js
# Mode 2 (Stable + Prerelease) — GH-80. `main` is permanently the prerelease
# channel: this file never toggles back and forth, only the rolling `stable`
# tag's own one-off copy of this same file (cut by docouture-release.yml, see
# templates/starter/.github/workflows/docouture-release.yml) says version: stable,
# prerelease: false. See versioning-modes.md for the full mechanism.
version: prerelease
prerelease: true
# The site's landing page (GH-18): `modules/ROOT/pages/index.adoc`, rendered
# through the UI bundle's `home` layout. A ROOT module index is what Antora
# treats as a component's start page by default, but naming it here is what
# stops it fabricating a synthetic component-root "previous" URL for the first
# nav entry — a page that doesn't exist — which broke the pagination footer's
# "previous" link on the very first page of the site.
#
# ROOT is deliberately absent from the `nav` list below: the landing is reached
# from the header's product name and the side menu's brand block, not as a row
# in the navigation tree, and it borrows `main`'s navigation for its own side
# menu (`:page-nav-module:` in that page's own header).
start_page: ROOT:index.adoc
nav:
  - modules/main/nav.adoc
  - modules/sdk/nav.adoc
  - modules/react/nav.adoc
  - modules/store-websockets/nav.adoc
  - modules/store-azure-web-pubsub/nav.adoc
  - modules/store-standalone/nav.adoc
  - modules/types/nav.adoc

# Per-module navigation metadata, read by @inditextech/docouture-antora-extensions
# (registered under `antora.extensions` in the playbook) and attached to the
# navigation trees Antora builds from the `nav` list above. It is what lets the
# UI show ONE module's navigation at a time with a switcher between them, the
# way Fumadocs did with `"root": true` in each module's own meta.json.
#
# A LIST, not a map keyed by module — deliberately, and it must stay one.
# @antora/content-aggregator runs the whole descriptor through `camelCaseKeys`,
# which recurses into nested objects and rewrites their KEYS. As a map, three of
# the seven modules below would arrive at the extension renamed
# (`store-azure-web-pubsub` as `storeAzureWebPubsub`) and match nothing. Values
# are left alone, so the slug rides as a value instead.
#
# `icon` is a bare icon name from the UI bundle's own vendored sprite
# (packages/ui-bundle/src/img/icons.yml), not a free-form name. The UI bundle
# vendors icons from Lucide — the same set the original Fumadocs source used
# — so these are matches now, not stand-ins the way an internal icon set
# once required.
#
# --- originally generated by the one-off Fumadocs migration tool (since
# removed, its job done); maintained by hand from here on
nav_modules:
  - module: main
    title: Framework
    description: The visual collaborative apps framework
    icon: grid-3x3
  - module: sdk
    title: SDK
    description: The visual collaborative tool headless library
    icon: code
  - module: react
    title: React Helper
    description: Set of React components to help you integrate Weave.js
    icon: wrench
  - module: store-websockets
    title: Websockets Store
    description: Store implementation using WebSockets as transport
    icon: wifi
  - module: store-azure-web-pubsub
    title: Azure Web Pubsub Store
    description: Store implementation using Azure Web Pubsub as transport
    icon: cloud
  - module: store-standalone
    title: Standalone Store
    description: Store implementation to render a Weave.js canvas in a direct way, just pass a room data.
    icon: server
  - module: types
    title: TypeScript Types
    description: Package that contains the TypeScript types definitions
    icon: file
# --- end generated

# Which module's navigation the generated 404 page's side menu shows,
# read by @inditextech/docouture-antora-extensions (not-found-page.js). This
# component has seven modules (nav_modules above) — with more than one,
# that extension has no default to fall back to (an empty side menu, not a
# guess, is what a component-less 404 page gets otherwise) — hand-authored,
# not generated, since it's a product decision, not a fact build-nav.mjs can
# derive from the Fumadocs source.
not_found_module: main

# llms.txt / llms-full.txt generation (GH-95), read by
# @inditextech/docouture-antora-extensions. `summary` becomes the blockquote
# under the site title in the generated `llms.txt`. `exclude` is a list of
# page IDs — the same strings `xref:...[]` accepts — left out of both
# generated files; useful for a page that exists only for internal review
# and shouldn't be handed to an LLM crawler. Same reasoning as `nav_modules`
# and `footer` above for why this lives here rather than in the playbook.
llms:
  summary: >-
    Weave.js is a visual collaborative apps framework: a headless,
    store-agnostic SDK plus React helpers for building real-time
    collaborative canvases.
  # exclude:
  #   - main:some-internal-page.adoc

# Site footer link groups (ui-bundle GH issue #18), read by
# @inditextech/docouture-antora-extensions and attached to this component version
# as `footer`. Authored here rather than in the playbook because `site.keys`
# is a flat primitive map and cannot carry a list — see that extension's own
# header for the full reasoning, which is the same one `nav_modules` above
# rests on.
#
# Group 1 fills the footer's links column. Group 2 is used for the modules
# column only when a component has fewer than two switchable modules — this
# one has seven (`nav_modules` above), so group 2 below is never actually
# rendered; it still has to be a real, valid group (not omitted) purely to
# hold that positional slot open, because the extension re-indexes groups
# after dropping invalid ones (see resolveFooter) — a footer.groups list is
# positional (index 0 → column 2, 1 → column 3's fallback, 2 → column 4), not
# keyed. Group 3 (GH-77) fills the footer's 4th column — here, a link out to
# the org's own open-source portal. `title` (GH-77) is optional per group;
# omit it for a column with no heading.
#
# `url` is either a page ID — the same string you would write inside
# `xref:...[]`, resolved against this component — or a literal URL. One that
# resolves to no page is dropped with a warning rather than rendered dead.
footer:
  groups:
    - title: Resources
      links:
        - text: Quickstart
          url: main:quickstart.adoc
        - text: SDK
          url: sdk:index.adoc
        - text: React Helper
          url: react:index.adoc
        - text: Stores
          url: main:build/stores/index.adoc
        - text: Repository
          url: https://github.com/InditexTech/weavejs
    - title: More
      links:
        - text: Repository
          url: https://github.com/InditexTech/weavejs
    - title: InditexTech
      links:
        - text: Portal
          url: https://opensource.inditex.com
