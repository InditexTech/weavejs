version = 1
SPDX-PackageName = "weavejs"
SPDX-PackageSupplier = "2025 INDUSTRIA DE DISEÑO TEXTIL S.A. (INDITEX S.A.)"
SPDX-PackageDownloadLocation = "https://github.com/InditexTech/weavejs"

[[annotations]]
path = [
    # root level licensing
    ".github/**",
    "images/**",
    "REUSE.toml",
    "repolinter.json",

    # Sonar Qube configuration
    "**/sonar-project.properties",

    # repeated files licensing
    "**/.gitignore",
    "**/tsconfig.json",
    "**/package*.json",
    "**/.eslintrc",

    # code/ directory licensing
    "code/packages/create-backend-app/**",
    "code/packages/create-frontend-app/**",
    "code/packages/store-azure-web-pubsub/docker-compose.yml",
    "code/packages/store-azure-web-pubsub/DockerfileExpressBackend",
    "code/packages/store-azure-web-pubsub/DockerfileKoaBackend",
    "code/packages/store-azure-web-pubsub/DockerfileNginx",
    "code/packages/store-azure-web-pubsub/nginx.conf",
    "code/packages/store-websockets/docker-compose.yml",
    "code/packages/store-websockets/DockerfileExpressBackend",
    "code/packages/store-websockets/DockerfileKoaBackend",
    "code/packages/store-websockets/DockerfileNginx",
    "code/packages/store-websockets/nginx.conf",
    "code/.husky/**",
    "code/verdaccio/**",
    "code/.eslintignore",
    "code/.prettierignore",
    "code/.prettierrc",
    "code/.tool-versions",
    "code/lerna.json",
    "code/nx.json",
    "code/tsconfig.base.json",
    "code/**/__snapshots__/**",

    # docs/ directory licensing
    "docs/**",

    # code/patches/ directory licensing
    "code/patches/**",

    # agents files
    "AGENTS.md",
    ".agents/**",
    "agent/**",
    "skills-lock.json",
    ".claude/commands/**",
    ".claude/skills/**",
    ".opencode/commands/**",
    ".opencode/skills/**",
    "openspec/**"
]
SPDX-FileCopyrightText = "2025 INDUSTRIA DE DISEÑO TEXTIL S.A. (INDITEX S.A.)"
SPDX-License-Identifier = "Apache-2.0"

# Vendored Stageshow kit (MIT), see docs/demos/kit/VENDORED.md
[[annotations]]
path = ["docs/demos/kit/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Benji Taylor"
SPDX-License-Identifier = "MIT"

# Self-hosted fonts (SIL OFL 1.1), see docs/supplemental-ui/fonts/README.md
[[annotations]]
path = ["docs/supplemental-ui/fonts/Inter-*.woff2", "docs/supplemental-ui/fonts/LICENSE-Inter.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["docs/supplemental-ui/fonts/NotoSansMono-*.woff2", "docs/supplemental-ui/fonts/LICENSE-NotoSansMono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/latin-greek-cyrillic)"
SPDX-License-Identifier = "OFL-1.1"
